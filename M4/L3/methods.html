<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript String Methods</h2>
    <p>Basic Methods</p>

    <script>
      var str = "Amazing";
      // TODO: Use the method toUpperCase() to convert the string to uppercase and display it in console
      var str2 = str.toUpperCase();
      console.log(str2);

      // TODO: Use the method toLowerCase() to convert the string to lowercase and display it in console
      var str3 = str.toLowerCase();
      console.log(str3);

      // Test Method -> returns true or false
      var str1 = "I learnt about Methods";
      var patt = /"about"/;

      // TODO: use the test() method to check if the string contains the word "about" and display it in console
      console.log(patt.test(str1));

    </script>
  </body>
</html>
