<!DOCTYPE html>
<html>
<head>
  <title>My Zoo</title>
  <style>

    body {
      font-family: Arial, sans-serif;
      background: aliceblue;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #ff5a43;
    }

    #zoo {
      border: 2px solid #ff5a43;
      width: 300px;
      margin: 16px auto;
      padding: 12px;
      border-radius: 10px;
      background: white;
    }

    .zone {
      border: 1px solid #ff5a43;
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: left;
    }

    button {
      background: #ff5a43;
      color: white;
      padding: 10px 24px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <h1>My Zoo</h1>
  <p>Use JavaScript and the DOM to add animals to each cage!</p>

  <!--
    DOM Tree: zoo is the parent element node.
    Zone divs are child element nodes. Animal names inside each span are text nodes.
  -->
  <div id="zoo">
    <div class="zone">Zone 1: <span id="zone1"></span></div>
    <div class="zone">Zone 2: <span id="zone2"></span></div>
    <div class="zone">Zone 3: <span id="zone3"></span></div>
    <div class="zone">Total Animals: <span id="total"></span></div>
  </div>

  <br>

  <button onclick="openZoo()">Open the Zoo!</button>

  <p id="zoo-status"></p>

  <script>

    function openZoo() {

      /* First animal in Zone 1 */
      document.getElementById("zone1").innerHTML = "Lion";

      /* TODO: Add your second animal to Zone 2 */
document.getElementById("zone2").innerHTML = "Tiger";
      /* TODO: Add your third animal to Zone 3 */
document.getElementById("zone3").innerHTML = "Bear";
      /* TODO: Show the total number of animals */
document.getElementById("total").innerHTML = 3;
      /* TODO: Change the zoo background colour */
document.getElementById("zoo").style.backgroundColor = "grey";
      /* TODO: Set the zoo status message to open using innerHTML */
document.getElementById("zoo-status").innerHTML = "The zoo is now open!";

    }

  </script>
</body>
</html>
