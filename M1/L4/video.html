<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An immersive aquatic beats party featuring ocean imagery and music.">
  <title>Aquatic Beats Party</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e9fbff;
      --muted: #b7dce5;
      --accent: #48e0d0;
      --accent-strong: #ffcf70;
      --surface: rgba(8, 37, 63, .78);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font: 1rem/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #126b86 0, transparent 35%),
        linear-gradient(145deg, #031526 0%, #052d4c 52%, #071b3a 100%);
    }

    header, main, footer { width: min(1100px, 92%); margin-inline: auto; }

    header { padding: clamp(3rem, 10vw, 7rem) 0 2rem; text-align: center; }

    .eyebrow {
      margin: 0 0 .5rem;
      color: var(--accent-strong);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1, h2 { line-height: 1.1; }
    h1 { max-width: 800px; margin: 0 auto; font-size: clamp(2.5rem, 8vw, 5.5rem); }
    h2 { margin-top: 0; font-size: clamp(1.6rem, 4vw, 2.5rem); }
    .intro { max-width: 650px; margin: 1.25rem auto 0; color: var(--muted); font-size: 1.15rem; }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 1.5rem;
      align-items: stretch;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(139, 235, 255, .2);
      border-radius: 1.25rem;
      background: var(--surface);
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, .25);
      backdrop-filter: blur(10px);
    }

    .card-content { padding: clamp(1.25rem, 4vw, 2rem); }
    .media { display: block; width: 100%; height: 100%; min-height: 300px; object-fit: cover; }
    video { background: #010b17; }
    .caption { margin: .75rem 0 0; color: var(--muted); font-size: .95rem; }

    footer { padding: 2rem 0 3rem; color: var(--muted); text-align: center; }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media (max-width: 600px) { .media { min-height: 240px; } }
  </style>
</head>

<body>
  <header>
    <p class="eyebrow">Dive in • Turn up • Float away</p>
    <h1>Welcome to My Aquatic Beats Party!</h1>
    <p class="intro">A deep-sea celebration of sound, colour, and ocean energy. Press play and let the tide set the rhythm.</p>
  </header>

  <main>
    <section class="card" aria-labelledby="ocean-heading">
      <div class="card-content">
        <h2 id="ocean-heading">Step 1: Meet the Ocean</h2>
        <div class="content-grid">
          <figure>
            <img class="media" src="poster.jpg" alt="An underwater ocean scene" width="350" height="350" loading="lazy">
            <figcaption class="caption">Every great beat begins beneath the surface.</figcaption>
          </figure>
          <figure>
            <video class="media" controls preload="metadata" width="350" height="350" poster="poster.jpg">
              <source src="aqua.mp4" type="video/mp4">
              Your browser does not support HTML video. Please download <a href="aqua.mp4">the video</a> instead.
            </video>
            <figcaption class="caption">Aquatic Beats — press play to begin the journey.</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer><small>Made with ocean energy and good vibrations.</small></footer>
</body>
</html>
