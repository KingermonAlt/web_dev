<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Join a rocket mission through an immersive collection of space media.">
<meta name="theme-color" content="#07111f">

<title>Rocket Mission</title>

<style>
	:root {
		color-scheme: dark;
		--background: #050914;
		--surface: rgba(13, 27, 49, .82);
		--text: #f4f8ff;
		--muted: #b6c5dc;
		--accent: #64d8ff;
		--accent-strong: #a878ff;
	}

	* { box-sizing: border-box; }

	html { scroll-behavior: smooth; }

	body {
		min-height: 100vh;
		margin: 0;
		display: grid;
		place-items: center;
		padding: clamp(1rem, 4vw, 4rem);
		color: var(--text);
		font: 1rem/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		background: radial-gradient(circle at 50% 0%, #183a69 0, var(--background) 55%);
	}

	main {
		width: min(100%, 900px);
		padding: clamp(1.5rem, 5vw, 4rem);
		text-align: center;
		background: var(--surface);
		border: 1px solid rgba(100, 216, 255, .25);
		border-radius: 1.5rem;
		box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .4), inset 0 1px rgba(255,255,255,.08);
		backdrop-filter: blur(12px);
	}

	h1 { margin: 0; color: var(--accent); font-size: clamp(2rem, 6vw, 4rem); line-height: 1.1; }
	h2 { margin-top: 2.5rem; color: var(--accent-strong); }
	p { color: var(--muted); font-size: 1.1rem; }

	.media { display: grid; gap: 1.25rem; justify-items: center; margin-top: 2rem; }
	img, video { max-width: 100%; height: auto; border-radius: 1rem; box-shadow: 0 .75rem 2rem rgba(0,0,0,.35); }
	audio { width: min(100%, 500px); }
	.caption { margin: 0; color: var(--muted); font-size: .9rem; }

	@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

</head>

<body>
<main>

<h1>Welcome to My Rocket Mission!</h1>

<p>Today, our rocket is getting ready to travel across space.</p>

<h2>Step 1: Meet the Rocket</h2>

<section class="media" aria-labelledby="media-title">
<h3 id="media-title">Mission Media</h3>

<img src="rocket.jpg" alt="A rocket ready to launch" width="350" height="350" loading="eager" decoding="async">

<audio controls loop preload="metadata">

<source src="music.mp3" type="audio/mpeg">

Your browser does not support the audio tag.

</audio>

<br><br>

<video width="500" height="350" controls poster="poster.jpg" loop preload="metadata" playsinline>

<source src="aqua.mp4" type="video/mp4">

Your browser does not support the video tag.

</video>
<p class="caption">Use the controls to explore the mission soundtrack and launch footage.</p>
</section>
</main>

</body>

</html>
