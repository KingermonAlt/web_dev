<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #color-card {
            width: 200px;
            height: 200px;
            background-color: #242f36;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }
        p {
            color: #fff;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Color Card</h1>
<div id="color-card">
<p>
    My name is Mcpherson. My favorite hobby is vibe coding. I like to explore new coding elements and extensions inside vs code.
    My favorite fruit is mangos.My favorite food is spaghetti.
</p>
    
</div>

</body>
</html>
